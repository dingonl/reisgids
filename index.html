<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f6f1e7;color:#2b2420;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#7a2e1f;color:#fff;padding:22px 18px 16px}header h1{margin:0;font-size:26px}header p{margin:6px 0 0;opacity:.9;font-size:15px}

.day ul{list-style:none;margin:0;padding:10px 16px 14px}.day li{padding:5px 0;font-size:15px;line-height:1.45}.open{color:#b25b00;font-weight:600}.ok{color:#1d7a35;font-weight:600}.past{opacity:.6}

// Reisgids-data: voeg nieuwe steden toe aan TRIPS en kies via ?stad=...
const am=(s,d,f)=>`https://maps.apple.com/?daddr=${d}&dirflg=${f}`;
const H='Schmiedingerstra%C3%9Fe%2046%20Salzburg';
const TRIPS={pompeii:{
 title:'Pompeii na de nachttrein',sub:'Start en eind: Moxy Pompeii (Via Castriota 43, Torre Annunziata) · Romeinse stad, straten, theaters en uitzicht op de Vesuvius',
 route:'https://www.google.com/maps/dir/Moxy+Pompeii,+Via+Castriota+43,+Torre+Annunziata/Porta+Marina+Pompei/Foro+di+Pompei/Teatro+Grande+Pompei/Via+dell%27Abbondanza+Pompei/Anfiteatro+di+Pompei/Villa+di+Poppea+Oplontis/Moxy+Pompeii,+Via+Castriota+43,+Torre+Annunziata',
 note:'🚆 Salerno 06:13 aan → <b>Trenitalia R 21306</b> Salerno 06:34 → Torre Annunziata Centrale 07:21 (Interrail, geen reservering; reserve: 07:07 → 07:54). Daarna 700 m / 9 min lopen naar Moxy. 🧳 Inchecken pas vanaf 15:00; bagage afgeven kan (bagageopslag, 24-uursreceptie), vroeg inchecken alleen als er een kamer vrij is. 🏛️ <b>Pompeii vanaf 15 okt: 09:00–17:00, laatste toegang 15:30</b>. <b>Pompei Express €20</b> (alleen de antieke stad, op naam, kaart via pompeii.vivaticket.it of aan de kassa). 🍽️ <b>Lunch:</b> Il Giardino dei Sensi, Via Villa dei Misteri 7 bij Porta Marina, 4,8★ uit 96 Google-reviews (open 11:30–15:30). <b>Avond:</b> Fattorie Garofalo in het Maximall naast het hotel, buffelmozzarella-broodjes, 5,0★ uit 99 reviews. Neem water en goede schoenen mee: de Romeinse straatstenen zijn glad en ongelijk.',
 stops:[
 {name:'Moxy Pompeii',img:null,time:'start',leg:'Start: hotel (Maximall Pompeii)',url:am('','Moxy%20Pompeii%2C%20Via%20Castriota%2043%2C%2080058%20Torre%20Annunziata','w'),
  text:'Na de nachttrein laat je je bagage achter bij de receptie (inchecken pas vanaf 15:00) en ontbijt je. Daarna ga je naar de opgravingen: 1,9 km, ca. 25 min lopen, of een taxi.'},
 {name:'Porta Marina',img:'img/28.jpg',time:'1,9 km · 25 min lopen',leg:'Moxy → ingang Porta Marina (opent 09:00)',url:am('','Porta%20Marina%2C%20Pompei','w'),
  text:'Je loopt de antieke stad binnen door de oude zeepoort, een steile gewelfde doorgang van basalt. Ooit lag de zee hier vlakbij; nu kijk je over de vlakte van de Sarno naar de bergen van Sorrento.'},
 {name:'Forum van Pompeii',img:'img/29.jpg',time:'ca. 5 min lopen',leg:'Porta Marina → Forum',url:am('','Foro%20di%20Pompei','w'),
  text:'Het hart van de stad: een langgerekt plein vol zuilen, met de Jupitertempel aan de kop en de Vesuvius die er dreigend achter oprijst. Dit is het klassieke uitzicht van Pompeii, en ’s ochtends nog rustig.'},
 {name:'Teatro Grande',img:'img/33.jpg',time:'ca. 10 min lopen',leg:'Forum → Theaterwijk',url:am('','Teatro%20Grande%2C%20Pompei','w'),
  text:'Het Griekse halfrond theater is in de helling gebouwd en bood plaats aan 5.000 toeschouwers. Ga bovenaan zitten voor het zicht over de ruïnes en het dal; naast de deur ligt het kleine overdekte Odeion.'},
 {name:'Via dell’Abbondanza',img:'img/30.jpg',time:'ca. 5 min lopen',leg:'Theaters → Via dell’Abbondanza',url:am('','Via%20dell%27Abbondanza%2C%20Pompei','w'),
  text:'De hoofdstraat van Pompeii, met diepe wagensporen in de basaltstenen en hoge stapstenen om over te steken. Langs de straat zie je bakkerijen, wijnbars en gevels met verkiezingsleuzen van bijna 2.000 jaar oud.'},
 {name:'Amfitheater van Pompeii',img:'img/31.jpg',time:'ca. 15 min lopen',leg:'Via dell’Abbondanza → Amfitheater',url:am('','Anfiteatro%20di%20Pompei','w'),
  text:'Het oudste bewaarde stenen amfitheater ter wereld (ca. 70 v.Chr.), groen omzoomd door pijnbomen. Hier speelden de gladiatoren. Loop daarna terug via Via dell’Abbondanza naar Porta Marina (ca. 15 min) en verlaat het park daar, uiterlijk rond 14:45 als je Oplontis nog wilt zien.'},
 {name:'Villa di Poppea, Oplontis (optioneel)',img:'img/45.jpg',time:'Circumvesuviana 1 halte',leg:'Pompei Scavi → Torre Annunziata-Oplonti, ca. 5 min lopen',url:am('','Villa%20di%20Poppea%2C%20Via%20Sepolcri%2C%20Torre%20Annunziata','w'),
  text:'De luxe zomervilla, vermoedelijk van keizerin Poppaea, de vrouw van Nero, ligt midden in Torre Annunziata. Hier zie je de best bewaarde illusionistische muurschilderingen van de hele regio: zuilen, vogels en tuinen in fel rood en geel. Open 09:00–17:00 (laatste toegang 16:00), €8, dinsdag gesloten: vandaag (maandag) kan het dus.'},
 {name:'Terug naar Moxy Pompeii',img:null,time:'2,3 km · 31 min lopen',leg:'Oplontis (of Piazza Anfiteatro per taxi) → hotel',url:am('','Moxy%20Pompeii%2C%20Via%20Castriota%2043%2C%2080058%20Torre%20Annunziata','w'),
  text:'Terug naar het hotel om bij te slapen na de nachttrein. Er zijn winkels en eetgelegenheden in het Maximall naast de deur.'}
 ]},
amalfi:{
 title:'Sorrento, Positano en Amalfi over zee',sub:'Start en eind: Moxy Pompeii · kliffen, dorpen tegen de rotsen en de boot langs de Amalfikust',
 route:'https://www.google.com/maps/dir/Moxy+Pompeii,+Via+Castriota+43,+Torre+Annunziata/Piazza+Tasso+Sorrento/Marina+Grande+Sorrento/Positano/Duomo+di+Amalfi/Salerno+Piazza+della+Concordia/Moxy+Pompeii,+Via+Castriota+43,+Torre+Annunziata',
 note:'🚆 <b>Circumvesuviana</b> Pompei Scavi → Sorrento (ca. 40 min, ca. elke 36 min, €4,60 EAV-ticket of tik in/uit met je contactloze kaart; niet op Interrail). ⛴️ <b>NLG 12:25</b> Sorrento (Marina Piccola) → Positano 13:05, dagelijks volgens de NLG-site, ca. €15–19 (alternatieven: Seremar 12:05, Alilauro 10:30/14:55). ⛴️ <b>Travelmar</b> Positano 15:30 → Amalfi (25 min, €9) en Amalfi 17:45 → Salerno 18:20 (35 min, €9), dienstregeling vanaf 18 okt. 🚆 <b>Trenitalia R 21348</b> Salerno 18:37 → Torre Annunziata Centrale 19:24 (Interrail), 9 min lopen naar het hotel. 🍽️ Da Vincenzo in Positano is dinsdag gesloten; zelf eten vond ik vandaag niets met genoeg recente reviews. Bij harde wind of hoge golven kunnen boten uitvallen; dan rijdt de SITA-bus (Amalfi → Salerno).',
 stops:[
 {name:'Moxy Pompeii',img:null,time:'ca. 09:00',leg:'Start: hotel → station Pompei Scavi',url:am('','Moxy%20Pompeii%2C%20Via%20Castriota%2043%2C%2080058%20Torre%20Annunziata','w'),
  text:'Loop 1,9 km (ca. 25 min) naar Circumvesuviana-station Pompei Scavi–Villa dei Misteri, vlak bij Porta Marina. Neem een trein rond 10:00 richting Sorrento.'},
 {name:'Piazza Tasso, Sorrento',img:'img/34.jpg',time:'ca. 35 min met de trein',leg:'Station Sorrento → Piazza Tasso',url:am('','Piazza%20Tasso%2C%20Sorrento','w'),
  text:'Het levendige centrale plein van Sorrento ligt boven een diepe, groene kloof, de Vallone dei Mulini, met een verlaten molen op de bodem. Kijk over de balustrade naar beneden voordat je de oude steegjes in loopt.'},
 {name:'Marina Grande, Sorrento',img:'img/32.jpg',time:'ca. 10 min lopen',leg:'Piazza Tasso → Villa Comunale → Marina Grande',url:am('','Marina%20Grande%2C%20Sorrento','w'),
  text:'Via het park Villa Comunale, met een spectaculair uitzicht over de Golf van Napels naar de Vesuvius, daal je af naar het vissershaventje met gekleurde bootjes. De veerboten vertrekken vanaf de nabije Marina Piccola (lift of trap vanaf de Villa Comunale).'},
 {name:'Positano',img:'img/35.jpg',time:'ca. 40 min met de boot',leg:'Marina Piccola → Positano',url:am('','Spiaggia%20Grande%2C%20Positano','w'),
  text:'Al varend zie je het dorp opdoemen: pastelkleurige huizen die als een waterval tegen de rotswand naar beneden lopen, met de majolicakoepel van de Santa Maria Assunta onderaan. Loop de trappetjes op voor het zicht terug op het strand.'},
 {name:'Boot langs de Amalfikust',img:'img/37.jpg',time:'25 min met de boot',leg:'Positano → Amalfi',url:am('','Porto%20di%20Amalfi','w'),
  text:'Het mooiste stuk van de dag: vanaf zee zie je de kliffen, wachttorens, grotten en bergdorpen als Praiano en Furore. Ga aan de rechterkant (stuurboord) aan dek staan.'},
 {name:'Duomo di Amalfi',img:'img/36.jpg',time:'ca. 3 min lopen',leg:'Haven → Piazza Duomo',url:am('','Duomo%20di%20Amalfi','w'),
  text:'Een brede trap leidt naar de Arabisch-Normandische kathedraal met zijn gestreepte gevel, gouden mozaïeken en bronzen deuren uit Constantinopel. Het Chiostro del Paradiso ernaast is een sprookjesachtige kloostergang.'},
 {name:'Lungomare van Salerno',img:'img/38.jpg',time:'35 min met de boot',leg:'Amalfi 17:45 → Salerno Piazza della Concordia',url:am('','Piazza%20della%20Concordia%2C%20Salerno','w'),
  text:'Je komt aan bij zonsondergang (rond 18:10) op de palmenpromenade van Salerno, met uitzicht terug op de kust. Het station ligt pal tegenover de aanlegplaats.'},
 {name:'Terug naar Moxy Pompeii',img:null,time:'ca. 1 uur',leg:'Trenitalia 18:37 Salerno → Torre Annunziata C.le 19:24, 9 min lopen',url:am('','Moxy%20Pompeii%2C%20Via%20Castriota%2043%2C%2080058%20Torre%20Annunziata','r'),
  text:'Met de regionale trein van Trenitalia (op je Interrail-pas) naar Torre Annunziata Centrale; het hotel ligt op 700 m van het station.'}
 ]},
napoli:{
 title:'Napels tot de nachttrein',sub:'Van Moxy Pompeii naar Napoli Centrale (ICN 23:06) · kerken, de oude stad, de baai en het uitzicht vanaf de Vomero',
 route:'https://www.google.com/maps/dir/Napoli+Centrale/Duomo+di+Napoli/Spaccanapoli/Piazza+del+Plebiscito/Castel+dell%27Ovo/Castel+Sant%27Elmo/Napoli+Centrale',
 note:'🧳 Uitchecken vóór 12:00. 🚆 <b>Trenitalia MT 21316</b> Torre Annunziata Centrale 09:55 → Napoli Piazza Garibaldi 10:33 (ondergronds onder Napoli Centrale; Interrail, geen reservering; elk uur, bv. 10:25, 11:25). 🧳 <b>KiPoint bagagedepot</b> Napoli Centrale, bij spoor 5: <b>dagelijks 08:00–20:00</b>, vanaf ca. €6 per stuk. <b>Haal je bagage vóór 20:00 op</b>, want je ICN vertrekt pas om 23:06. 🚇 Metro of funicolare voor de Vomero: eigen ticket ca. €1,50. Castel Sant’Elmo: kasteel en bastions 08:30–19:30, laatste toegang ca. 18:00, €5. 🍕 <b>Pizza:</b> Gino e Toto Sorbillo, Via dei Tribunali 32, 4,5★ uit ca. 30.800 Google-reviews; reken op een rij, kom vóór 12:00 of na 15:00.',
 stops:[
 {name:'Moxy Pompeii',img:null,time:'ochtend',leg:'Start: uitchecken → station Pompei Scavi',url:am('','Moxy%20Pompeii%2C%20Via%20Castriota%2043%2C%2080058%20Torre%20Annunziata','w'),
  text:'Pak in, check uit en loop 700 m (9 min) naar Torre Annunziata Centrale voor de Trenitalia-trein naar Napels.'},
 {name:'Napoli Centrale',img:'img/44.jpg',time:'ca. 40 min met de trein',leg:'Napoli P. Garibaldi → bagagedepot',url:am('','Napoli%20Centrale','w'),
  text:'Het moderne station aan de Piazza Garibaldi. Lever je koffer in bij KiPoint (spoor 5) en ga licht op pad.'},
 {name:'Duomo di Napoli',img:'img/39.jpg',time:'ca. 15 min lopen',leg:'Centrale → Via Duomo',url:am('','Duomo%20di%20Napoli','w'),
  text:'Op weg hierheen loop je over de Via dei Tribunali langs Sorbillo voor de lunch. De gotische kathedraal van San Gennaro, de beschermheilige van de stad. Binnen zie je de barokke schatkapel en de vroegchristelijke doopkapel met mozaïeken uit de 5e eeuw.'},
 {name:'Spaccanapoli',img:'img/40.jpg',time:'ca. 5 min lopen',leg:'Duomo → Via San Biagio dei Librai → Piazza del Gesù',url:am('','Piazza%20del%20Ges%C3%B9%20Nuovo%2C%20Napoli','w'),
  text:'Deze kaarsrechte Romeinse straat snijdt de oude stad doormidden. Wasgoed hangt tussen de palazzi, kapelletjes zitten in de muren, en je loopt langs San Gregorio Armeno met zijn kerststalwinkels, de Santa Chiara-kloostergang met majolicategels en de diamantgevel van de Gesù Nuovo.'},
 {name:'Piazza del Plebiscito',img:'img/41.jpg',time:'ca. 15 min lopen',leg:'Via Toledo → Piazza del Plebiscito',url:am('','Piazza%20del%20Plebiscito%2C%20Napoli','w'),
  text:'Via de drukke Via Toledo en de glazen Galleria Umberto I kom je bij het grootste plein van Napels, met de halfronde zuilengalerij van San Francesco di Paola tegenover het Palazzo Reale.'},
 {name:'Castel dell’Ovo en de Lungomare',img:'img/42.jpg',time:'ca. 10 min lopen',leg:'Plebiscito → Borgo Marinari',url:am('','Castel%20dell%27Ovo%2C%20Napoli','w'),
  text:'Het oudste kasteel van de stad staat op een rotseilandje in zee, met een vissershaventje aan de voet. Vanaf de muren (gratis) kijk je over de baai naar de Vesuvius en Capri; loop daarna een stuk over de autovrije zeepromenade.'},
 {name:'Castel Sant’Elmo',img:'img/43.jpg',time:'ca. 25 min (funicolare)',leg:'Funicolare Centrale (Augusteo) → Vomero',url:am('','Castel%20Sant%27Elmo%2C%20Napoli','r'),
  text:'De stervormige vesting op de Vomero-heuvel geeft het beste panorama van Napels: de hele stad, de baai en de Vesuvius aan je voeten. Ideaal rond zonsondergang (ca. 18:10); de Certosa di San Martino ligt ernaast.'},
 {name:'Terug naar Napoli Centrale',img:null,time:'ca. 25 min met de metro',leg:'Metro lijn 1 Vanvitelli → Garibaldi',url:am('','Napoli%20Centrale','r'),
  text:'Haal je bagage vóór 20:00 op bij KiPoint en wacht in de stationshal op de ICN van 23:06 naar Palermo.'}
 ]},
interlaken:{
 title:'Interlaken tussen de treinen',sub:'Start en eind: station Interlaken Ost · 11:54 aankomst, 16:04 terug · bergen, meren en de Aare',
 route:'https://www.google.com/maps/dir/Interlaken+Ost/Harderbahn+Interlaken/Harder+Kulm/Unterseen+Stadthausplatz/H%C3%B6hematte+Interlaken/Interlaken+Ost',
 note:'⏱️ <b>Tijdvak ca. 4 uur</b> (11:54–16:04). 🚠 Harderbahn: elk halfuur, retour ca. CHF 44, met Interrail 50% korting (ca. CHF 22). Ben om 15:45 terug op het station.',
 stops:[
 {name:'Station Interlaken Ost',img:'img/21.jpg',time:'aankomst 11:54',leg:'Start',url:am('','Interlaken%20Ost','w'),
  text:'Je stapt uit de panoramatrein midden tussen de Brienzersee en de bergen. Lockers vind je in het station als je bagage bij je hebt.'},
 {name:'Harderbahn',img:'img/16.jpg',time:'ca. 5 min lopen',leg:'Interlaken Ost → over de Aare → dalstation',url:am('','Harderbahn%2C%20Interlaken','w'),
  text:'Over de brug over de turquoise Aare loop je naar het dalstation. Het rode kabelspoor klimt in 10 minuten steil door het bos omhoog; ga rechts zitten voor het mooiste zicht.'},
 {name:'Harder Kulm',img:'img/17.jpg',time:'10 min met de kabelbaan',leg:'Dalstation → Harder Kulm (1322 m)',url:am('','Harder%20Kulm','w'),
  text:'Vanaf de Zwei-Seen-Steg, een uitkijkbrug boven de afgrond, zie je beide meren tegelijk: de Thunersee en de Brienzersee, met Eiger, Mönch en Jungfrau recht tegenover je. Het restaurant in sprookjesstijl heeft een terras met hetzelfde uitzicht. Trek er ca. 1–1,5 uur voor uit.'},
 {name:'Langs de Aare',img:'img/20.jpg',time:'ca. 15 min lopen',leg:'Dalstation → Aarepromenade → Unterseen',url:am('','Unterseen%2C%20Stadthausplatz','w'),
  text:'Het pad langs de rivier volgt het melkachtig groene gletsjerwater tussen de twee meren. Rustig, groen en vol bankjes, met de bergen telkens op de achtergrond.'},
 {name:'Unterseen oude stad',img:'img/18.jpg',time:'ca. 3 min lopen',leg:'Aare → Stadthausplatz',url:am('','Stadthausplatz%2C%20Unterseen','w'),
  text:'Het middeleeuwse stadje aan de overkant van de Aare is veel ouder dan Interlaken. Je ziet er houten huizen met diepe daken, de stadskerk met zijn slanke toren en het pleintje rond het Stadthaus.'},
 {name:'Höhematte en Höheweg',img:'img/19.jpg',time:'ca. 15 min lopen',leg:'Unterseen → Höhematte',url:am('','H%C3%B6hematte%2C%20Interlaken','w'),
  text:'Dit grote, open grasveld midden in het dorp mag nooit bebouwd worden, zodat je er altijd het onbelemmerde uitzicht op de besneeuwde Jungfrau hebt. Aan de Höheweg staan belle-époque-hotels, zoals het statige Victoria-Jungfrau. Hier landen ook de paragliders.'},
 {name:'Terug naar Interlaken Ost',img:null,time:'ca. 15 min lopen',leg:'Höheweg → Interlaken Ost',url:am('','Interlaken%20Ost','w'),
  text:'Je loopt in een rechte lijn over de Höheweg terug naar het station, voor de Luzern–Interlaken Express van 16:04.'}
 ]},
luzern:{
 title:'Avondwandeling Luzern',sub:'Van station Luzern naar het Renaissance Lucerne (Pilatusstrasse 15) · bruggen, de Reuss en het meer',
 route:'https://www.google.com/maps/dir/Bahnhof+Luzern/Kapellbr%C3%BCcke/Weinmarkt+Luzern/M%C3%A4nnliturm+Luzern/Spreuerbr%C3%BCcke/Jesuitenkirche+Luzern/Renaissance+Lucerne+Hotel,+Pilatusstrasse+15',
 note:'🌆 Aankomst 17:55. De Museggmauer is tot 19:00 gratis open (t/m 1 nov). Ga er dus vóór 18:45 naartoe. Zonsondergang is rond 18:40, daarna zijn de bruggen en de oude stad prachtig verlicht.',
 stops:[
 {name:'Station Luzern, KKL en het meer',img:'img/22.jpg',time:'aankomst 17:55',leg:'Start: Bahnhof Luzern',url:am('','Bahnhof%20Luzern','w'),
  text:'Naast het station staat het KKL van Jean Nouvel, met zijn enorme zwevende dak boven het water. Loop even naar de kade voor het uitzicht over het Vierwaldstättersee, met de Pilatus en de Rigi op de achtergrond.'},
